const $ = id =>
    document.getElementById(id);


/* =========================================================
   HTML SECURITY
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   СООБЩЕНИЯ
========================================================= */

function showMessage(
    text,
    type="error"
){

    $("messageBox").innerHTML =
        `<div class="${type}">
            ${escapeHtml(text)}
        </div>`;

    setTimeout(
        () => {
            $("messageBox").innerHTML = "";
        },
        5000
    );
}


/* =========================================================
   SUPABASE
========================================================= */

function initSupabase(){

    try{

        if(
            !S_URL ||
            !S_KEY
        ){

            throw new Error(
                "Supabase не настроен"
            );

        }


        if(
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
        ){

            throw new Error(
                "Библиотека Supabase не загрузилась"
            );

        }


        sb =
            window.supabase.createClient(
                S_URL,
                S_KEY
            );


        return true;

    }catch(error){

        console.error(
            "Supabase:",
            error
        );

        $("locationSearch").disabled =
            true;

        $("sendButton").disabled =
            true;

        $("feedContainer").innerHTML =
            `<div class="empty">
                ⚠️ Ошибка подключения к базе данных.
            </div>`;

        return false;
    }
}


/* =========================================================
   РЕКЛАМА
========================================================= */

function applyAd(
    url,
    target
){

    const img =
        $("adPoster");

    const link =
        $("adLink");


    if(
        url &&
        String(url).trim().length > 5
    ){

        img.src =
            url;

        img.style.display =
            "block";

        $("adDefaultText")
            .style.display =
            "none";

    }else{

        img.removeAttribute("src");

        img.style.display =
            "none";

        $("adDefaultText")
            .style.display =
            "block";
    }


    link.href =
        (
            target &&
            String(target).trim().length > 5
        )
        ?
        target
        :
        DEFAULT_AD_TARGET;
}


async function loadSettings(){

    if(!sb) return;


    try{

        const {
            data,
            error
        } =
            await sb
                .from("app_settings")
                .select("key,value");


        if(error){

            console.warn(
                "Настройки рекламы:",
                error.message
            );

            applyAd(
                "",
                DEFAULT_AD_TARGET
            );

            return;
        }


        const settings =
            Object.fromEntries(
                (data || []).map(
                    x => [
                        x.key,
                        x.value
                    ]
                )
            );


        applyAd(
            settings.ad_url || "",
            settings.ad_target ||
            DEFAULT_AD_TARGET
        );

    }catch(error){

        console.warn(
            error
        );

        applyAd(
            "",
            DEFAULT_AD_TARGET
        );
    }
}


async function saveSetting(
    key,
    value
){

    if(!sb)
        throw new Error(
            "Supabase не подключён"
        );


    const {
        error
    } =
        await sb
            .from("app_settings")
            .upsert(
                {
                    key,
                    value
                },
                {
                    onConflict:"key"
                }
            );


    if(error)
        throw error;
}


async function updateAd(){

    if(!adminUnlocked)
        return;


    try{

        const url =
            $("adUrlInput")
                .value
                .trim();

        const target =
            $("adTargetInput")
                .value
                .trim();


        if(
            url &&
            !/^https?:\/\//i.test(url)
        ){

            alert(
                "Ссылка на плакат должна начинаться с http:// или https://"
            );

            return;
        }


        if(
            target &&
            !/^https?:\/\//i.test(target)
        ){

            alert(
                "Ссылка должна начинаться с http:// или https://"
            );

            return;
        }


        await saveSetting(
            "ad_url",
            url
        );


        await saveSetting(
            "ad_target",
            target
        );


        applyAd(
            url,
            target ||
            DEFAULT_AD_TARGET
        );


        alert(
            "Реклама обновлена."
        );

    }catch(error){

        alert(
            "Ошибка: " +
            error.message
        );
    }
}


async function clearAd(){

    try{

/* =========================================================
   ЗАГРУЗКА МЕСТ
========================================================= */

async function loadLocations(){

    if(!sb) return;


    const {
        data,
        error
    } =
        await sb
            .from("custom_locations")
            .select("id,name")
            .order("name");


    if(error){

        console.error(
            "Места:",
            error
        );

        locationsCache = [];

        $("searchResults").style.display =
            "none";

        return;
    }


    locationsCache =
        data || [];


    renderSearchResults(
        $("locationSearch").value
    );
}


/* =========================================================
   ПОИСК МЕСТА
========================================================= */

function normalizeText(
    value
){

    return String(value || "")
        .toLowerCase()
        .trim();
}


function selectLocation(
    name
){

    selectedLocationValue =
        String(name || "")
            .trim();


    $("locationSearch").value =
        selectedLocationValue;


    $("selectedLocationName")
        .textContent =
        selectedLocationValue;


    $("selectedLocation")
        .style.display =
        "block";


    $("searchResults")
        .style.display =
        "none";
}


function openAddLocation(){

    $("newLocInput").value =
        $("locationSearch")
            .value
            .trim();


    $("customLocOverlay")
        .style.display =
        "flex";


    setTimeout(
        () => {
            $("newLocInput").focus();
        },
        50
    );
}


function renderSearchResults(
    query=""
){

    const results =
        $("searchResults");


    const q =
        normalizeText(query);


    let filtered =
        locationsCache;


    if(q){

        filtered =
            locationsCache.filter(
                location =>
                    normalizeText(
                        location.name
                    ).includes(q)
            );
    }


    let html = "";


    if(filtered.length){

        filtered.forEach(
            location => {

                html +=
                    `<div
                        class="search-result"
                        data-location="${escapeHtml(location.name)}"
                    >
                        📍 ${escapeHtml(location.name)}
                    </div>`;

            }
        );

    }


    /*
       Если ничего не найдено —
       появляется кнопка добавления.
    */

    if(
        q &&
        filtered.length === 0
    ){

        html +=
            `<div
                class="search-add"
                id="searchAddLocation"
            >
                ➕ Добавить «${escapeHtml(query.trim())}»
            </div>`;

    }


    /*
       Если поле пустое,
       показываем существующие места.
    */

    if(
        !q &&
        filtered.length === 0
    ){

        html =
            `<div class="empty">
                Мест пока нет.
            </div>

            <div
                class="search-add"
                id="searchAddLocation"
            >
                ➕ Добавить новое место
            </div>`;
    }


    results.innerHTML =
        html;


    if(
        q ||
        locationsCache.length
    ){

        results.style.display =
            "block";

    }else{

        results.style.display =
            "none";
    }


    results
        .querySelectorAll(
            ".search-result"
        )
        .forEach(
            item => {

                item.addEventListener(
                    "click",
                    () => {

                        selectLocation(
                            item.dataset.location
                        );

                    }
                );

            }
        );


    const addButton =
        $("searchAddLocation");


    if(addButton){

        addButton.addEventListener(
            "click",
            openAddLocation
        );

    }
}


/* =========================================================
   ДОБАВЛЕНИЕ МЕСТА
========================================================= */

async function addLocation(
    name
){

    name =
        String(name || "")
            .trim()
            .replace(/\s+/g," ");


    if(
        name.length < 2
    ){

        throw new Error(
            "Введите название места."
        );
    }


    if(
        name.length > 80
    ){

        throw new Error(
            "Название слишком длинное."
        );
    }


    const exists =
        locationsCache.some(
            x =>
                normalizeText(x.name) ===
                normalizeText(name)
        );


    if(exists){

        selectLocation(
            locationsCache.find(
                x =>
                    normalizeText(x.name) ===
                    normalizeText(name)
            ).name
        );

        return;
    }


    const {
        error
    } =
        await sb
            .from("custom_locations")
            .insert([
                {
                    name
                }
            ]);


    if(error)
        throw error;


    await loadLocations();

    selectLocation(name);
}

                        deleteLoc(

                                btn.dataset.id
                            ),
                            btn.dataset.name
                        )
                );

            }
        );
}


async function deleteLoc(
    id,
    name
){

    if(!adminUnlocked)
        return;


    if(
        !confirm(
            `Удалить место "${name}"?`
        )
    )
        return;


    const {
        error
    } =
        await sb
            .from("custom_locations")
            .delete()
            .eq("id",id);


    if(error){

        alert(
            "Ошибка: " +
            error.message
        );

        return;
    }


    await loadLocations();

    await renderAdminLocations();
}


/* =========================================================
   АДМИНКА
========================================================= */

function closePopup(
    id
){

    $(id).style.display =
        "none";
}


async function openAdmin(){

    const pass =
        prompt("Пароль:");


    if(
        pass !== ADMIN_PASS
    ){

        alert(
            "Неверный пароль."
        );

        return;
    }


    adminUnlocked =
        true;


    $("adminOverlay")
        .style.display =
        "flex";


    await renderAdminLocations();

    await loadSettingsIntoAdmin();
}


async function loadSettingsIntoAdmin(){

    if(!sb) return;


    try{

        const {
            data,
            error
        } =
            await sb
                .from("app_settings")
                .select("key,value");


        if(error)
            throw error;


        const settings =
            Object.fromEntries(
                (data || []).map(
                    x => [
                        x.key,
                        x.value
                    ]
                )
            );


        $("adUrlInput").value =
            settings.ad_url || "";


        $("adTargetInput").value =
            settings.ad_target ||
            DEFAULT_AD_TARGET;

    }catch(error){

        console.warn(
            error.message
        );

        $("adTargetInput").value =
            DEFAULT_AD_TARGET;
    }
}


/* =========================================================
   ОТПРАВКА СООБЩЕНИЯ
========================================================= */

function getCooldownRemaining(){

    const last =
        Number(
            localStorage.getItem(
                "last_report_time"
            ) || 0
        );


    return Math.max(
        0,
        REPORT_COOLDOWN_MS -
        (
            Date.now() -
            last
        )
    );
}


async function sendReport(){

    if(!sb){

        showMessage(
            "Supabase не подключён."
        );

        return;
    }


    const remaining =
        getCooldownRemaining();


    if(remaining > 0){

        showMessage(
            `Подождите ${Math.ceil(
                remaining / 1000
            )} сек. перед следующим сообщением.`
        );

        return;
    }


    const loc =
        selectedLocationValue.trim();


    const car =
        $("carSelect").value;


    if(!loc){

        showMessage(
            "Выберите место из поиска."
        );

        $("locationSearch").focus();

        return;
    }


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .insert([
                {
                    lat:1,
                    lng:1,
                    car_type:
                        `${loc} -> [${car}]`
                }
            ]);


    if(error){

        console.error(
            error
        );

        showMessage(
            "Не удалось отправить сообщение: " +
            error.message
        );

        return;
    }


    localStorage.setItem(
        "last_report_time",
        String(Date.now())
    );


    showMessage(
        "Сообщение опубликовано.",
        "success"
    );


    await loadFeed();
}


/* =========================================================
   ПАРСИНГ СООБЩЕНИЙ
========================================================= */

function parseReport(
    item
){

    const raw =
        String(
            item.car_type || ""
        );


    const separator =
        " -> ";


    const index =
        raw.indexOf(
            separator
        );


    if(index === -1){

        return {
            location:
                raw ||
                "Неизвестно",

            car:
                "Не указано"
        };
    }


    return {

        location:
            raw.slice(
                0,
                index
            ),

        car:
            raw
                .slice(
                    index +
                    separator.length
                )
                .replace(
                    /^\[/,
                    ""
                )
                .replace(
                    /\]$/,
                    ""
                )
    };
}


/* =========================================================
   ВРЕМЯ
========================================================= */

function timeAgo(
    dateString
){

    const diff =
        Math.max(
            0,
            Date.now() -
            new Date(
                dateString
            ).getTime()
        );


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1)
        return "только что";


    if(minutes === 1)
        return "1 минуту назад";


    if(minutes < 5)
        return `${minutes} минуты назад`;


    return `${minutes} минут назад`;
}


function publicationTime(
    dateString
){

    const date =
        new Date(
            dateString
        );


    return date.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}


/* =========================================================
   ОЧИСТКА СТАРЫХ
========================================================= */

async function cleanupExpiredReports(){

    if(!sb) return;


    const limit =
        new Date(
            Date.now() -
            REPORT_LIFETIME_MS
        ).toISOString();


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .delete()
            .lt(
                "created_at",
                limit
            );


    if(error){

        console.warn(
            "Очистка:",
            error.message
        );
    }
}


/* =========================================================
   ЛЕНТА
========================================================= */

async function loadFeed(){

    if(!sb) return;


    const limit =
        new Date(
            Date.now() -
            REPORT_LIFETIME_MS
        ).toISOString();


    const {
        data,
        error
    } =
        await sb
            .from("dps_markers")
            .select("*")
            .gt(
                "created_at",
                limit
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            error
        );

        $("feedContainer").innerHTML =
            `<div class="empty">
                Ошибка загрузки:
                ${escapeHtml(
                    error.message
                )}
            </div>`;

        return;
    }


    const cont =
        $("feedContainer");


    if(
        !data ||
        !data.length
    ){

        cont.innerHTML =
            `<div class="empty">
                На дорогах спокойно 🚗
            </div>`;

        return;
    }


    cont.innerHTML =
        data.map(
            item => {

                const report =
                    parseReport(
                        item
                    );


                return `

                <div class="feed-item">

                    <div class="feed-location">
                        📍 ${escapeHtml(
                            report.location
                        )}
                    </div>

                    <div class="feed-car">
                        🚓 ${escapeHtml(
                            report.car
                        )}
                    </div>

                    <div class="feed-time">

                        🕐 Опубликовано:
                        ${publicationTime(
                            item.created_at
                        )}

                        ·

                        ${timeAgo(
                            item.created_at
                        )}

                    </div>

                    <div class="status-panel">

                        <span style="font-size:12px">
                            Сообщение актуально?
                        </span>

                        <div
                            style="
                                display:flex;
                                gap:5px
                            "
                        >

                            <button
                                class="vote-btn vote-yes"
                                data-id="${item.id}"
                                style="
                                    background:#e2f0d9
                                "
                            >
                                Да
                            </button>

                            <button
                                class="vote-btn vote-no"
                                data-id="${item.id}"
                                style="
                                    background:#fce4d6
                                "
                            >
                                Нет
                            </button>

                        </div>

                    </div>

                </div>

                `;
            }
        ).join("");


    document
        .querySelectorAll(".vote-yes")
        .forEach(
            btn => {

                btn.addEventListener(
                    "click",
                    () =>
                        vote(
                            Number(
                                btn.dataset.id
                            ),
                            true
                        )
                );

            }
        );


    document
        .querySelectorAll(".vote-no")
        .forEach(
            btn => {

                btn.addEventListener(
                    "click",
                    () =>
                        vote(
                            Number(
                                btn.dataset.id
                            ),
                            false
                        )
                );

            }
        );
}


/* =========================================================
   ГОЛОСОВАНИЕ
========================================================= */

async function vote(
    id,
    ok
){

    if(!sb) return;


    const createdAt =
        ok
        ?
        new Date().toISOString()
        :
        new Date(0).toISOString();


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .update({
                created_at:
                    createdAt
            })
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Ошибка голосования: " +
            error.message
        );

        return;
    }


    await cleanupExpiredReports();

    await loadFeed();
}


/* =========================================================
   АДМИН — ОЧИСТКА
========================================================= */

async function clearOldReports(){

    if(!adminUnlocked)
        return;


    if(
        !confirm(
            "Удалить все сообщения старше 20 минут?"
        )
    )
        return;


    await cleanupExpiredReports();

    await loadFeed();


    alert(
        "Очистка выполнена."
    );
}


/* =========================================================
   СОБЫТИЯ
========================================================= */

function setupEvents(){

    /* Поиск */

    $("locationSearch")
        .addEventListener(
            "input",
            e => {

                selectedLocationValue = "";

                $("selectedLocation")
                    .style.display =
                    "none";

                renderSearchResults(
                    e.target.value
                );

            }
        );


    $("locationSearch")
        .addEventListener(
            "focus",
            () => {

                renderSearchResults(
                    $("locationSearch").value
                );

            }
        );


    /* Enter */

    $("locationSearch")
        .addEventListener(
            "keydown",
            e => {

                if(
                    e.key === "Enter"
                ){

                    e.preventDefault();


                    const value =
                        $("locationSearch")
                            .value
                            .trim();


                    const found =
                        locationsCache.find(
                            x =>
                                normalizeText(
                                    x.name
                                ) ===
                                normalizeText(
                                    value
                                )
                        );


                    if(found){

                        selectLocation(
                            found.name
                        );

                    }else if(
                        value.length >= 2
                    ){

                        openAddLocation();

                    }
                }
            }
        );


    /* Отправка */

    $("sendButton")
        .addEventListener(
            "click",
            sendReport
        );


    /* Админка */

    $("adminButton")
        .addEventListener(
            "click",
            openAdmin
        );


    /* Добавление места */

    $("cancelCustom")
        .addEventListener(
            "click",
            () => {

                closePopup(
                    "customLocOverlay"
                );

                $("locationSearch").focus();

            }
        );


    $("saveCustom")
        .addEventListener(
            "click",
            saveNewLocation
        );


    $("newLocInput")
        .addEventListener(
            "keydown",
            e => {

                if(
                    e.key === "Enter"
                ){

                    e.preventDefault();

                    saveNewLocation();

                }

            }
        );


    /* Реклама */

    $("updateAdBtn")
        .addEventListener(
            "click",
            updateAd
        );


    $("clearAdBtn")
        .addEventListener(
            "click",
            clearAd
        );


    /* Добавление места админом */

    $("adminAddLocation")
        .addEventListener(
            "click",
            async () => {

                try{

                    await addLocation(
                        $("adminNewLocation")
                            .value
                    );


                    $("adminNewLocation")
                        .value = "";


                    await renderAdminLocations();

                }catch(error){

                    alert(
                        error.message
                    );
                }
            }
        );


    /* Очистка */

    $("clearOldReports")
        .addEventListener(
            "click",
            clearOldReports
        );


    /* Закрытие админки */

    $("closeAdmin")
        .addEventListener(
            "click",
            () => {

                adminUnlocked =
                    false;

                closePopup(
                    "adminOverlay"
                );

            }
        );


    /* Клик вне окна */

    document
        .querySelectorAll(".overlay")
        .forEach(
            overlay => {

                overlay.addEventListener(
                    "click",
                    e => {

                        if(
                            e.target === overlay
                        ){

                            closePopup(
                                overlay.id
                            );

                        }

                    }
                );

            }
        );


    /* Закрытие поиска кликом вне */

    document.addEventListener(
        "click",
        e => {

            const wrap =
                document.querySelector(
                    ".search-wrap"
                );


            if(
                wrap &&
                !wrap.contains(e.target)
            ){

                $("searchResults")
                    .style.display =
                    "none";

            }

        }
    );
}


/* =========================================================
   ЗАПУСК
========================================================= */

async function init(){

    setupEvents();


    /*
       Сразу устанавливаем
       рабочую ссылку рекламы.
    */

    applyAd(
        "",
        DEFAULT_AD_TARGET
    );


    if(
        !initSupabase()
    )
        return;


    await Promise.all([

        loadLocations(),

        loadSettings(),

        cleanupExpiredReports(),

        loadFeed()

    ]);


    /*
       Обновление каждые 15 секунд.
    */

    setInterval(
        async () => {

            await cleanupExpiredReports();

            await loadFeed();

            await loadSettings();

        },
        15000
    );
}


init();

</script>
