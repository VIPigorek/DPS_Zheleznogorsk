/* =========================================================

========================================================= */

const REPORT_LIFETIME_MS =
    20 * 60 * 1000;

const REPORT_COOLDOWN_MS =

/* =========================================================
   GLOBALS
========================================================= */

let sb = null;

let locationsCache = [];

/* =========================================================
   DOM HELPER
========================================================= */

function $(id){
    return document.getElementById(id);
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
){

    $("messageBox").innerHTML =
        `<div class="${type}">
            ${escapeHtml(text)}
        </div>`;


    setTimeout(
        () => {

            $("messageBox").innerHTML =
                "";

        },
        5000
    );
}


/* =========================================================
   SUPABASE INITIALIZATION
========================================================= */

function initSupabase(){

    /*
       Проверяем библиотеку.
    */

    if(
        !window.supabase ||
        typeof window.supabase.createClient !==
        "function"
    ){

        console.error(
            "[DPS] Supabase JS не загрузился."
        );

        $("connectionStatus").textContent =
            "❌ Не удалось загрузить Supabase.";

        $("feedContainer").innerHTML =
            `<div class="empty">
                ❌ Не удалось загрузить соединение с базой.
            </div>`;

        return false;
    }


    /*
       Проверяем настройки.
    */

    if(
        !S_URL ||
        !S_KEY ||
        S_URL.includes("YOUR_PROJECT") ||
        S_KEY.includes("YOUR_PUBLISHABLE")
    ){

        console.error(
            "[DPS] Не заполнены настройки Supabase."
        );

        $("connectionStatus").textContent =
            "❌ Supabase не настроен.";

        $("feedContainer").innerHTML =
            `<div class="empty">
                ❌ Не настроено подключение к базе.
            </div>`;

        return false;
    }


    /*
       Создаём клиента.
    */

    try{

        sb =
            window.supabase.createClient(
                S_URL,
                S_KEY
            );


        if(!sb){

            throw new Error(
                "createClient вернул null"
            );
        }


        $("connectionStatus").textContent =
            "🟢 Соединение с базой установлено";


        console.log(
            "[DPS] Supabase подключён."
        );


        return true;

    }catch(error){

        console.error(
            "[DPS] Ошибка создания клиента:",
            error
        );


        sb = null;


        $("connectionStatus").textContent =
            "🔴 Ошибка подключения к базе";


        $("feedContainer").innerHTML =
            `<div class="empty">
                ❌ Ошибка подключения к Supabase.
            </div>`;


        return false;
    }
}


/* =========================================================
   SAFE SUPABASE CHECK
========================================================= */

function hasSupabase(){

    if(!sb){

        console.error(
            "[DPS] Попытка обращения к Supabase до инициализации."
        );

        showMessage(
            "Соединение с базой ещё не готово. Обновите страницу."
        );

        return false;
    }

    return true;
}


/* =========================================================
   AD SETTINGS
========================================================= */

async function loadSettings(){

    if(!hasSupabase())
        return;


    try{

        const {
            data,
            error
        } =
            await sb
                .from("app_settings")
                .select("key,value");


        if(error){

            console.warn(
                "[DPS] Настройки рекламы:",
                error.message
            );

            return;
        }


        const settings =
            Object.fromEntries(
                (data || []).map(
                    item => [
                        item.key,
                        item.value
                    ]
                )
            );


        applyAd(
            settings.ad_url || "",
            settings.ad_target || ""
        );

    }catch(error){

        console.error(
            "[DPS] loadSettings:",
            error
        );
    }
}


function applyAd(
    url,
    target
){

    const img =
        $("adPoster");

    const link =
        $("adLink");


    if(
        url &&
        String(url).trim().length > 5
    ){

        img.src =
            String(url).trim();

        img.style.display =
            "block";

        $("adDefaultText")
            .style.display =
            "none";

    }else{

        img.removeAttribute(
            "src"
        );

        img.style.display =
            "none";

        $("adDefaultText")
            .style.display =
            "block";
    }


    if(
        target &&
        String(target).trim().length > 5
    ){

        link.href =
            String(target).trim();

    }else{

        link.href =
            "https://t.me";
    }
}


async function saveSetting(
    key,
    value
){

    if(!hasSupabase())
        throw new Error(
            "Supabase не подключён."
        );


    const {
        error
    } =
        await sb
            .from("app_settings")
            .upsert(
                {
                    key:key,
                    value:value
                },
                {
                    onConflict:"key"
                }
            );


    if(error)
        throw error;
}


async function updateAd(){

    if(!adminUnlocked)
        return;


    try{

        const url =
            $("adUrlInput")
                .value
                .trim();


        const target =
            $("adTargetInput")
                .value
                .trim();


        if(
            url &&
            !/^https?:\/\//i.test(url)
        ){

            alert(
                "Ссылка на плакат должна начинаться с http:// или https://"
            );

            return;
        }


        if(
            target &&
            !/^https?:\/\//i.test(target)
        ){

            alert(
                "Ссылка должна начинаться с http:// или https://"
            );

            return;
        }


        await saveSetting(
            "ad_url",
            url
        );


        await saveSetting(
            "ad_target",
            target
        );


        applyAd(
            url,
            target
        );


        alert(
            "Реклама обновлена для всех пользователей."
        );

    }catch(error){

        alert(
            "Ошибка: " +
            error.message
        );
    }
}

        applyAd(
            "",
            ""
        );


    }catch(error){

        alert(
            "Ошибка: " +
            error.message
        );
    }
}


/* =========================================================
   LOCATIONS
========================================================= */

async function loadLocations(){

    if(!hasSupabase())
        return;


    try{

        const {
            data,
            error
        } =
            await sb
                .from("custom_locations")
                .select("id,name")
                .order("name");


        if(error){

            console.error(
                "[DPS] Места:",
                error.message
            );

            $("locationSearch")
                .placeholder =
                "Ошибка загрузки мест";

            return;
        }


        locationsCache =
            data || [];


        $("locationSelect").innerHTML =
            locationsCache
                .map(
                    location =>
                        `<option value="${escapeHtml(
                            location.name
                        )}">
                            ${escapeHtml(
                                location.name
                            )}
                        </option>`
                )
                .join("");


        console.log(
            "[DPS] Загружено мест:",
            locationsCache.length
        );


    }catch(error){

        console.error(
            "[DPS] loadLocations:",
            error
        );
    }
}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeSearch(
    value
){

    return String(
        value || ""
    )
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ");
}


/* =========================================================
   SEARCH
========================================================= */

function renderSearchResults(){

    const input =
        $("locationSearch");


    const query =
        normalizeSearch(
            input.value
        );


    const results =
        $("searchResults");


    if(!query){

        results.style.display =
            "none";

        results.innerHTML =
            "";

        return;
    }


    const filtered =
        locationsCache.filter(
            location =>
                normalizeSearch(
                    location.name
                ).includes(query)
        );


    if(filtered.length > 0){

        results.innerHTML =
            filtered
                .map(
                    location =>
                        `
                        <div
                            class="search-result"
                            data-location="${escapeHtml(
                                location.name
                            )}"
                        >

                            <div class="search-result-name">
                                📍
                                ${escapeHtml(
                                    location.name
                                )}
                            </div>

                        </div>
                        `
                )
                .join("");


        results.style.display =
            "block";


        results
            .querySelectorAll(
                ".search-result"
            )
            .forEach(
                element => {

                    element.addEventListener(
                        "click",
                        () => {

                            chooseLocation(
                                element.dataset.location
                            );

                        }
                    );

                }
            );


        return;
    }


    /*
       Если место не найдено —
       предлагаем добавить.
    */

    const cleanQuery =
        input.value
            .trim();


    results.innerHTML =
        `
        <div class="search-empty">
            🔎 Место «${escapeHtml(
                cleanQuery
            )}» не найдено
        </div>

        <button
            type="button"

/* =========================================================
   ADD LOCATION
========================================================= */

async function addLocation(
    name
){

    if(!hasSupabase())
        throw new Error(
            "Соединение с базой не готово."
        );


    name =
        String(
            name || ""
        )
        .trim()
        .replace(/\s+/g," ");


    if(name.length < 2){

        throw new Error(
            "Введите название места."
        );
    }


    if(name.length > 80){

        throw new Error(
            "Название слишком длинное."
        );
    }


    /*
       Проверяем локальный список.
    */

    const existing =
        locationsCache.find(
            location =>
                normalizeSearch(
                    location.name
                ) ===
                normalizeSearch(
                    name
                )
        );


    if(existing){

        chooseLocation(
            existing.name
        );

        return;
    }


    /*
       Проверяем базу повторно,
       чтобы не создать дубль.
    */

    const {
        data:existingRows,
        error:findError
    } =
        await sb
            .from("custom_locations")
            .select("id,name")
            .ilike(
                "name",
                name
            )
            .limit(1);


    if(findError)
        throw findError;


    if(
        existingRows &&
        existingRows.length
    ){

        await loadLocations();


        chooseLocation(
            existingRows[0].name
        );

        return;
    }


    /*
       Добавляем новое место.
    */

    const {
        data,
        error
    } =
        await sb
            .from("custom_locations")
            .insert([
                {
                    name:name
                }
            ])
            .select("id,name")
            .single();


    if(error)
        throw error;


    await loadLocations();


    chooseLocation(
        data?.name || name
    );
}

/* =========================================================
   COOLDOWN
========================================================= */

function getCooldownRemaining(){

    const last =
        Number(
            localStorage.getItem(
                "last_report_time"
            ) || 0
        );


    return Math.max(
        0,
        REPORT_COOLDOWN_MS -
        (
            Date.now() -
            last
        )
    );
}


/* =========================================================
   SEND REPORT
========================================================= */

async function sendReport(){

    if(!hasSupabase())
        return;


    const remaining =
        getCooldownRemaining();


    if(remaining > 0){

        showMessage(
            `Подождите ${Math.ceil(
                remaining / 1000
            )} сек. перед следующим сообщением.`
        );

        return;
    }


    const loc =
        selectedLocation;


    const car =
        $("carSelect")
            .value;


    if(!loc){

        showMessage(
            "Сначала найдите и выберите место."
        );

        return;
    }


    /*
       Проверяем, что место существует.
    */

    const exists =
        locationsCache.some(
            location =>
                normalizeSearch(
                    location.name
                ) ===
                normalizeSearch(
                    loc
                )
        );


    if(!exists){

        showMessage(
            "Это место ещё не добавлено."
        );

        return;
    }


    try{

        const {
            error
        } =
            await sb
                .from("dps_markers")
                .insert([
                    {
                        lat:1,
                        lng:1,
                        car_type:
                            `${loc} -> [${car}]`
                    }
                ]);


        if(error)
            throw error;


        localStorage.setItem(
            "last_report_time",
            String(
                Date.now()
            )
        );


        showMessage(
            "Сообщение опубликовано.",
            "success"
        );


        await loadFeed();


    }catch(error){

        console.error(
            "[DPS] sendReport:",
            error
        );


        showMessage(
            "Не удалось отправить сообщение: " +
            error.message
        );
    }
}


/* =========================================================
   PARSE REPORT
========================================================= */

function parseReport(
    item
){

    const raw =
        String(
            item.car_type || ""
        );


    const separator =
        " -> ";


    const index =
        raw.indexOf(
            separator
        );


    if(index === -1){

        return {

            location:
                raw ||
                "Неизвестно",

            car:
                "Не указано"

        };
    }


    return {

        location:
            raw.slice(
                0,
                index
            ),

        car:
            raw
                .slice(
                    index +
                    separator.length
                )
                .replace(
                    /^\[/,
                    ""
                )
                .replace(
                    /\]$/,
                    ""
                )
    };
}


/* =========================================================
   EXACT PUBLICATION TIME
========================================================= */

function formatPublicationTime(
    dateString
){

    const date =
        new Date(
            dateString
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Время неизвестно";
    }


    return date.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );
}


/* =========================================================
   TIME AGO
========================================================= */

function timeAgo(
    dateString
){

    const date =
        new Date(
            dateString
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "время неизвестно";
    }


    const diff =
        Math.max(
            0,
            Date.now() -
            date.getTime()
        );


    const minutes =
        Math.floor(
            diff /
            60000
        );


    if(minutes < 1)
        return "только что";


    if(minutes === 1)
        return "1 минуту назад";


    if(
        minutes >= 2 &&
        minutes <= 4
    )
        return `${minutes} минуты назад`;


    return `${minutes} минут назад`;
}

async function cleanupExpiredReports(){

    try{

            ).toISOString();


        const {
            error
        } =
            await sb
                .from("dps_markers")
                .delete()
                .lt(
                    "created_at",
                    limit
                );


        if(error){

            console.warn(
                "[DPS] cleanup:",
                error.message
            );
        }


    }catch(error){

        console.error(
            "[DPS] cleanup:",
            error
        );
    }
}


/* =========================================================
   LOAD FEED
========================================================= */

async function loadFeed(){

    if(!hasSupabase())
        return;


    try{

        const limit =
            new Date(
                Date.now() -
                REPORT_LIFETIME_MS
            ).toISOString();


        const {
            data,
            error
        } =
            await sb
                .from("dps_markers")
                .select("*")
                .gt(
                    "created_at",
                    limit
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error)
            throw error;


        const container =
            $("feedContainer");


        if(
            !data ||
            data.length === 0
        ){

            container.innerHTML =
                `
                <div class="empty">
                    На дорогах спокойно 🚗
                </div>
                `;

            return;
        }


        container.innerHTML =
            data
                .map(
                    item => {

                        const report =
                            parseReport(
                                item
                            );


                        return `
                        <div
                            class="feed-item"
                        >

                            <div
                                class="feed-location"
                            >
                                📍
                                ${escapeHtml(
                                    report.location
                                )}
                            </div>


                            <div
                                class="feed-car"
                            >
                                🚓
                                ${escapeHtml(
                                    report.car
                                )}
                            </div>


                            <div
                                class="feed-published"
                            >
                                🕐 Опубликовано в
                                ${formatPublicationTime(
                                    item.created_at
                                )}
                            </div>


                            <div
                                class="feed-time"
                            >
                                ⏱
                                ${timeAgo(
                                    item.created_at
                                )}
                            </div>


                            <div
                                class="status-panel"
                            >

                                <span
                                    style="
                                        font-size:12px;
                                    "
                                >
                                    Сообщение актуально?
                                </span>


                                <div
                                    style="
                                        display:flex;
                                        gap:5px;
                                    "
                                >

                                    <button
                                        class="vote-btn vote-yes"
                                        data-id="${item.id}"
                                        style="
                                            background:#e2f0d9;
                                        "
                                    >
                                        Да
                                    </button>


                                    <button
                                        class="vote-btn vote-no"
                                        data-id="${item.id}"
                                        style="
                                            background:#fce4d6;
                                        "
                                    >
                                        Нет
                                    </button>

                                </div>

                            </div>

                        </div>
                        `;
                    }
                )
                .join("");


        /*
           Кнопки "Да".
        */

        document
            .querySelectorAll(
                ".vote-yes"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () =>
                            vote(
                                Number(
                                    button.dataset.id
                                ),
                                true
                            )
                    );

                }
            );


        /*
           Кнопки "Нет".
        */

        document
            .querySelectorAll(
                ".vote-no"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () =>
                            vote(
                                Number(
                                    button.dataset.id
                                ),
                                false
                            )
                    );

                }
            );


    }catch(error){

        console.error(
            "[DPS] loadFeed:",
            error
        );


        $("feedContainer").innerHTML =
            `
            <div class="empty">
                ❌ Ошибка загрузки сообщений:<br>
                ${escapeHtml(
                    error.message
                )}
            </div>
            `;
    }
}


/* =========================================================
   VOTE
========================================================= */

async function vote(
    id,
    ok
){

    if(!hasSupabase())
        return;


    try{

        /*
           При "Да" обновляем время.
           При "Нет" делаем запись старой.
        */

        const createdAt =
            ok
                ? new Date().toISOString()
                : new Date(0).toISOString();


        const {
            error
        } =
            await sb
                .from("dps_markers")
                .update(
                    {
                        created_at:
                            createdAt
                    }
                )
                .eq(
                    "id",
                    id
                );


        if(error)
            throw error;


        await cleanupExpiredReports();

        await loadFeed();


    }catch(error){

        alert(
            "Ошибка голосования: " +
            error.message
        );
    }
}

/* =========================================================
   EVENTS
========================================================= */

function setupEvents(){

    /*
       Поиск.
    */

    $("locationSearch")
        .addEventListener(
            "input",
            renderSearchResults
        );


    /*
       Enter в поиске.
    */

    $("locationSearch")
        .addEventListener(
            "keydown",
            async event => {

                if(
                    event.key !==
                    "Enter"
                )
                    return;


                event.preventDefault();


                const query =
                    normalizeSearch(
                        $("locationSearch")
                            .value
                    );


                if(!query)
                    return;


                const matches =
                    locationsCache.filter(
                        location =>
                            normalizeSearch(
                                location.name
                            ).includes(
                                query
                            )
                    );


                if(
                    matches.length > 0
                ){

                    chooseLocation(
                        matches[0].name
                    );

                }else{

                    await addLocationFromSearch();
                }

            }
        );


    /*
       Закрытие результатов поиска
       при клике в другом месте.
    */

    document.addEventListener(
        "click",
        event => {

            const wrapper =
                document.querySelector(
                    ".location-search-wrapper"
                );


            if(
                wrapper &&
                !wrapper.contains(
                    event.target
                )
            ){

                $("searchResults")
                    .style.display =
                    "none";
            }

        }
    );


    /*
       Отправка.
    */

    $("sendButton")
        .addEventListener(
            "click",
            sendReport
        );


    /*
       Админка.
    */

    $("adminButton")
        .addEventListener(
            "click",
            openAdmin
        );


    /*
       Popup.
    */

    $("cancelCustom")
        .addEventListener(
            "click",
            () =>
                closePopup(
                    "customLocOverlay"
                )
        );


    $("saveCustom")
        .addEventListener(
            "click",
            saveNewLocation
        );


    $("newLocInput")
        .addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Enter"
                ){

                    saveNewLocation();
                }

            }
        );


    /*
       Реклама.
    */

    $("updateAdBtn")
        .addEventListener(
            "click",
            updateAd
        );


    $("clearAdBtn")
        .addEventListener(
            "click",
            clearAd
        );


    /*
       Добавление места из админки.
    */

    $("adminAddLocation")
        .addEventListener(
            "click",
            async () => {

                try{

                    const name =
                        $("adminNewLocation")
                            .value
                            .trim();


                    if(!name){

                        alert(
                            "Введите место."
                        );

                        return;
                    }


                    await addLocation(
                        name
                    );


                    $("adminNewLocation")
                        .value =
                        "";


                    await renderAdminLocations();


                }catch(error){

                    alert(
                        error.message
                    );
                }

            }
        );


    /*
       Очистка.
    */

    $("clearOldReports")
        .addEventListener(
            "click",
            clearOldReports
        );


    /*
       Закрыть админку.
    */

    $("closeAdmin")
        .addEventListener(
            "click",
            () => {

                adminUnlocked =
                    false;


                closePopup(
                    "adminOverlay"
                );
            }
        );


    /*
       Закрытие popup по клику
       на затемнение.
    */

    document
        .querySelectorAll(
            ".overlay"
        )
        .forEach(
            overlay => {

                overlay.addEventListener(
                    "click",
                    event => {

                        if(
                            event.target ===
                            overlay
                        ){

                            closePopup(
                                overlay.id
                            );
                        }

                    }
                );

            }
        );
}

/* =========================================================
   INITIALIZATION
========================================================= */

async function init(){

    console.log(
        "[DPS] Запуск сайта..."
    );


    /*
       Сначала создаём Supabase.
       Только после успешного создания
       выполняем запросы.
    */

    const connected =
        initSupabase();


    if(!connected){

        console.error(
            "[DPS] Инициализация остановлена."
        );

        return;
    }


    /*
       Только здесь sb гарантированно существует.
    */

    setupEvents();


    try{

        await loadLocations();

        await loadSettings();

        await cleanupExpiredReports();

        await loadFeed();


    }catch(error){

        console.error(
            "[DPS] Ошибка начальной загрузки:",
            error
        );
    }


    /*
       Автообновление каждые 15 секунд.
    */

    setInterval(
        async () => {

            if(!sb)
                return;


            await cleanupExpiredReports();

            await loadFeed();

            await loadSettings();

        },
        15000
    );


    console.log(
        "[DPS] Сайт полностью запущен."
    );
}


/* =========================================================
   START

if(
    document.readyState ===
    "loading"
){

    document.addEventListener(
        "DOMContentLoaded",
        init
    );

}else{

}
