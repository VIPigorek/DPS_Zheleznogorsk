<script>

/* =========================================================
   НАСТРОЙКИ
   ========================================================= */

const ADMIN_PASS = "13208642";

const S_URL =
    "https://seslhhndjqicavaxgjaf.supabase.co";

const S_KEY =
    "sb_publishable_weHdvrwyfuVnR8HsFUurmA_sAesJgMK";

const REPORT_LIFETIME_MS =
    20 * 60 * 1000;

const REPORT_COOLDOWN_MS =
    30 * 1000;


let sb = null;

let locationsCache = [];

let adminUnlocked = false;

let selectedLocation = "";


/* =========================================================
   DOM
   ========================================================= */

const $ = id =>
    document.getElementById(id);


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function showMessage(
    text,
    type = "error"
){

    $("messageBox").innerHTML =
        `<div class="${type}">
            ${escapeHtml(text)}
        </div>`;


    setTimeout(() => {

        $("messageBox").innerHTML = "";

    },5000);
}


/* =========================================================
   SUPABASE
   ========================================================= */

function initSupabase(){

    try{

        sb =
            window.supabase.createClient(
                S_URL,
                S_KEY
            );

        console.log(
            "[DPS] Supabase подключён"
        );

        return true;

    }catch(error){

        console.error(error);

        $("feedContainer").innerHTML =
            `<div class="empty">
                ❌ Не удалось подключиться к Supabase.
            </div>`;

        return false;
    }
}


/* =========================================================
   НАСТРОЙКИ РЕКЛАМЫ
   ========================================================= */

async function loadSettings(){

    if(!sb) return;

    const {
        data,
        error
    } =
        await sb
            .from("app_settings")
            .select("key,value");


    if(error){

        console.warn(
            "Настройки:",
            error.message
        );

        return;
    }


    const settings =
        Object.fromEntries(
            (data || []).map(
                x => [
                    x.key,
                    x.value
                ]
            )
        );


    applyAd(
        settings.ad_url || "",
        settings.ad_target || ""
    );
}


function applyAd(
    url,
    target
){

    const img =
        $("adPoster");

    const link =
        $("adLink");


    if(
        url &&
        String(url).trim().length > 5
    ){

        img.src = url;

        img.style.display =
            "block";

        $("adDefaultText")
            .style.display =
            "none";

    }else{

        img.removeAttribute(
            "src"
        );

        img.style.display =
            "none";

        $("adDefaultText")
            .style.display =
            "block";
    }


    if(
        target &&
        String(target).trim().length > 5
    ){

        link.href =
            target;

    }else{

        link.href =
            "https://t.me";
    }
}


async function saveSetting(
    key,
    value
){

    const {
        error
    } =
        await sb
            .from("app_settings")
            .upsert(
                {
                    key,
                    value
                },
                {
                    onConflict:"key"
                }
            );


    if(error)
        throw error;
}


async function updateAd(){

    try{

        const url =
            $("adUrlInput")
                .value
                .trim();


        const target =
            $("adTargetInput")
                .value
                .trim();


        if(
            url &&
            !/^https?:\/\//i.test(url)
        ){

            alert(
                "Ссылка на плакат должна начинаться с http:// или https://"
            );

            return;
        }


        if(
            target &&
            !/^https?:\/\//i.test(target)
        ){

            alert(
                "Ссылка должна начинаться с http:// или https://"
            );

            return;
        }


        await saveSetting(
            "ad_url",
            url
        );


        await saveSetting(
            "ad_target",
            target
        );


        applyAd(
            url,
            target
        );


        alert(
            "Реклама обновлена для всех пользователей."
        );

    }catch(error){

        alert(
            "Ошибка: " +
            error.message
        );
    }
}


async function clearAd(){

    try{

        await saveSetting(
            "ad_url",
            ""
        );


        await saveSetting(
            "ad_target",
            ""
        );


        $("adUrlInput").value =
            "";


        $("adTargetInput").value =
            "";


        applyAd(
            "",
            ""
        );

    }catch(error){

        alert(
            "Ошибка: " +
            error.message
        );
    }
}


/* =========================================================
   МЕСТА
   ========================================================= */

async function loadLocations(){

    if(!sb) return;


    const {
        data,
        error
    } =
        await sb
            .from("custom_locations")
            .select("id,name")
            .order("name");


    if(error){

        console.error(error);

        $("locationSearch").placeholder =
            "Ошибка загрузки мест";

        return;
    }


    locationsCache =
        data || [];


    $("locationSelect").innerHTML =
        locationsCache
            .map(
                location =>
                    `<option value="${escapeHtml(
                        location.name
                    )}">
                        ${escapeHtml(
                            location.name
                        )}
                    </option>`
            )
            .join("");
}


/* =========================================================
   ПОИСК
   ========================================================= */

function normalizeSearch(value){

    return String(
        value || ""
    )
        .toLowerCase()
        .trim()
        .replace(/\s+/g," ");
}


function renderSearchResults(){

    const query =
        normalizeSearch(
            $("locationSearch").value
        );


    const results =
        $("searchResults");


    if(!query){

        results.style.display =
            "none";

        results.innerHTML =
            "";

        return;
    }


    const filtered =
        locationsCache.filter(
            location =>
                normalizeSearch(
                    location.name
                ).includes(query)
        );


    if(filtered.length){

        results.innerHTML =
            filtered
                .map(
                    location =>
                        `<div
                            class="search-result"
                            data-location="${escapeHtml(
                                location.name
                            )}">

                            <div class="search-result-name">
                                📍
                                ${escapeHtml(
                                    location.name
                                )}
                            </div>

                        </div>`
                )
                .join("");


        results.style.display =
            "block";


        results
            .querySelectorAll(
                ".search-result"
            )
            .forEach(
                element => {

                    element.addEventListener(
                        "click",
                        () => {

                            chooseLocation(
                                element.dataset.location
                            );

                        }
                    );

                }
            );


        return;
    }


    results.innerHTML =
        `
        <div class="search-empty">
            🔎 Место не найдено
        </div>

        <button
            type="button"
            class="add-search-location"
            id="addSearchLocationBtn"
        >
            ➕ Добавить «${escapeHtml(
                $("locationSearch").value.trim()
            )}»
        </button>
        `;


    results.style.display =
        "block";


    $("addSearchLocationBtn")
        .addEventListener(
            "click",
            addLocationFromSearch
        );
}


function chooseLocation(name){

    name =
        String(name || "")
            .trim();


    if(!name)
        return;


    selectedLocation =
        name;


    $("locationSelect").value =
        name;


    $("selectedLocationName")
        .textContent =
        name;


    $("selectedLocation")
        .style.display =
        "block";


    $("locationSearch").value =
        name;


    $("searchResults")
        .style.display =
        "none";


    $("searchResults")
        .innerHTML =
        "";
}


async function addLocationFromSearch(){

    const name =
        $("locationSearch")
            .value
            .trim();


    if(name.length < 2){

        showMessage(
            "Введите название места."
        );

        return;
    }


    try{

        await addLocation(
            name
        );


        chooseLocation(
            name
        );


        showMessage(
            "Место добавлено и выбрано.",
            "success"
        );


    }catch(error){

        showMessage(
            error.message
        );
    }
}


async function addLocation(name){

    name =
        String(name || "")
            .trim()
            .replace(/\s+/g," ");


    if(name.length < 2)
        throw new Error(
            "Введите название места."
        );


    if(name.length > 80)
        throw new Error(
            "Название слишком длинное."
        );


    const existing =
        locationsCache.find(
            x =>
                x.name.toLowerCase() ===
                name.toLowerCase()
        );


    if(existing){

        chooseLocation(
            existing.name
        );

        return;
    }


    const {
        error
    } =
        await sb
            .from("custom_locations")
            .insert([
                {
                    name
                }
            ]);


    if(error)
        throw error;


    await loadLocations();


    chooseLocation(
        name
    );
}


/* =========================================================
   АДМИНКА
   ========================================================= */

async function openAdmin(){

    const pass =
        prompt(
            "Пароль:"
        );


    if(
        pass !==
        ADMIN_PASS
    ){

        alert(
            "Неверный пароль."
        );

        return;
    }


    adminUnlocked =
        true;


    $("adminOverlay")
        .style.display =
        "flex";


    await renderAdminLocations();

    await loadSettingsIntoAdmin();
}


async function loadSettingsIntoAdmin(){

    if(!sb) return;


    const {
        data
    } =
        await sb
            .from("app_settings")
            .select("key,value");


    const settings =
        Object.fromEntries(
            (data || []).map(
                x => [
                    x.key,
                    x.value
                ]
            )
        );


    $("adUrlInput").value =
        settings.ad_url || "";


    $("adTargetInput").value =
        settings.ad_target || "";
}


async function renderAdminLocations(){

    if(!sb) return;


    const {
        data,
        error
    } =
        await sb
            .from("custom_locations")
            .select("id,name")
            .order("name");


    if(error){

        $("adminLocList").innerHTML =
            `<div class="error">
                Ошибка:
                ${escapeHtml(
                    error.message
                )}
            </div>`;

        return;
    }


    $("adminLocList").innerHTML =
        data?.length
            ? data
                .map(
                    location =>
                        `<div class="admin-loc-item">

                            <span>
                                ${escapeHtml(
                                    location.name
                                )}
                            </span>

                            <button
                                class="del-btn"
                                data-id="${location.id}"
                                data-name="${escapeHtml(
                                    location.name
                                )}">
                                ❌
                            </button>

                        </div>`
                )
                .join("")

            : `<div class="empty">
                Мест пока нет.
            </div>`;


    document
        .querySelectorAll(
            ".del-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        deleteLoc(
                            Number(
                                button.dataset.id
                            ),
                            button.dataset.name
                        )
                );

            }
        );
}


async function deleteLoc(
    id,
    name
){

    if(!adminUnlocked)
        return;


    if(
        !confirm(
            `Удалить место "${name}"?`
        )
    )
        return;


    const {
        error
    } =
        await sb
            .from("custom_locations")
            .delete()
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Ошибка: " +
            error.message
        );

        return;
    }


    await loadLocations();

    await renderAdminLocations();


    if(
        selectedLocation ===
        name
    ){

        selectedLocation =
            "";


        $("locationSearch").value =
            "";


        $("selectedLocation")
            .style.display =
            "none";
    }
}


/* =========================================================
   REPORT
   ========================================================= */

function getCooldownRemaining(){

    const last =
        Number(
            localStorage.getItem(
                "last_report_time"
            ) || 0
        );


    return Math.max(
        0,
        REPORT_COOLDOWN_MS -
        (
            Date.now() -
            last
        )
    );
}


async function sendReport(){

    if(!sb){

        showMessage(
            "Supabase не подключён."
        );

        return;
    }


    const remaining =
        getCooldownRemaining();


    if(remaining > 0){

        showMessage(
            `Подождите ${Math.ceil(
                remaining / 1000
            )} сек. перед следующим сообщением.`
        );

        return;
    }


    const loc =
        selectedLocation;


    const car =
        $("carSelect").value;


    if(
        !loc ||
        !locationsCache.some(
            x =>
                x.name ===
                loc
        )
    ){

        showMessage(
            "Сначала найдите и выберите место."
        );

        return;
    }


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .insert([
                {
                    lat:1,
                    lng:1,
                    car_type:
                        `${loc} -> [${car}]`
                }
            ]);


    if(error){

        console.error(error);

        showMessage(
            "Не удалось отправить сообщение: " +
            error.message
        );

        return;
    }


    localStorage.setItem(
        "last_report_time",
        String(
            Date.now()
        )
    );


    showMessage(
        "Сообщение опубликовано.",
        "success"
    );


    await loadFeed();
}


/* =========================================================
   REPORT PARSER
   ========================================================= */

function parseReport(item){

    const raw =
        String(
            item.car_type || ""
        );


    const separator =
        " -> ";


    const index =
        raw.indexOf(
            separator
        );


    if(index === -1){

        return {
            location:
                raw ||
                "Неизвестно",

            car:
                "Не указано"
        };
    }


    return {

        location:
            raw.slice(
                0,
                index
            ),

        car:
            raw
                .slice(
                    index +
                    separator.length
                )
                .replace(
                    /^\[/,
                    ""
                )
                .replace(
                    /\]$/,
                    ""
                )
    };
}


/* =========================================================
   ВРЕМЯ
   ========================================================= */

function formatPublicationTime(
    dateString
){

    const date =
        new Date(
            dateString
        );


    if(
        Number.isNaN(
            date.getTime()
        )
    ){

        return "Время неизвестно";
    }


    return date.toLocaleTimeString(
        "ru-RU",
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );
}


function timeAgo(
    dateString
){

    const diff =
        Math.max(
            0,
            Date.now() -
            new Date(
                dateString
            ).getTime()
        );


    const minutes =
        Math.floor(
            diff / 60000
        );


    if(minutes < 1)
        return "только что";


    if(minutes === 1)
        return "1 минуту назад";


    if(minutes < 5)
        return `${minutes} минуты назад`;


    return `${minutes} минут назад`;
}


/* =========================================================
   CLEANUP
   ========================================================= */

async function cleanupExpiredReports(){

    if(!sb) return;


    const limit =
        new Date(
            Date.now() -
            REPORT_LIFETIME_MS
        ).toISOString();


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .delete()
            .lt(
                "created_at",
                limit
            );


    if(error){

        console.warn(
            "Очистка:",
            error.message
        );
    }
}


/* =========================================================
   FEED
   ========================================================= */

async function loadFeed(){

    if(!sb) return;


    const limit =
        new Date(
            Date.now() -
            REPORT_LIFETIME_MS
        ).toISOString();


    const {
        data,
        error
    } =
        await sb
            .from("dps_markers")
            .select("*")
            .gt(
                "created_at",
                limit
            )
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(error);

        $("feedContainer").innerHTML =
            `<div class="empty">
                Ошибка загрузки:
                ${escapeHtml(
                    error.message
                )}
            </div>`;

        return;
    }


    const cont =
        $("feedContainer");


    if(
        !data ||
        !data.length
    ){

        cont.innerHTML =
            `<div class="empty">
                На дорогах спокойно 🚗
            </div>`;

        return;
    }


    cont.innerHTML =
        data
            .map(
                item => {

                    const report =
                        parseReport(
                            item
                        );


                    return `
                        <div class="feed-item">

                            <div class="feed-location">
                                📍
                                ${escapeHtml(
                                    report.location
                                )}
                            </div>

                            <div class="feed-car">
                                🚓
                                ${escapeHtml(
                                    report.car
                                )}
                            </div>

                            <div class="feed-published">
                                🕐 Опубликовано в
                                ${formatPublicationTime(
                                    item.created_at
                                )}
                            </div>

                            <div class="feed-time">
                                ⏱ ${timeAgo(
                                    item.created_at
                                )}
                            </div>

                            <div class="status-panel">

                                <span style="font-size:12px">
                                    Сообщение актуально?
                                </span>

                                <div style="display:flex;gap:5px">

                                    <button
                                        class="vote-btn vote-yes"
                                        data-id="${item.id}"
                                        style="background:#e2f0d9"
                                    >
                                        Да
                                    </button>

                                    <button
                                        class="vote-btn vote-no"
                                        data-id="${item.id}"
                                        style="background:#fce4d6"
                                    >
                                        Нет
                                    </button>

                                </div>

                            </div>

                        </div>
                    `;
                }
            )
            .join("");


    document
        .querySelectorAll(
            ".vote-yes"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        vote(
                            Number(
                                button.dataset.id
                            ),
                            true
                        )
                );

            }
        );


    document
        .querySelectorAll(
            ".vote-no"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () =>
                        vote(
                            Number(
                                button.dataset.id
                            ),
                            false
                        )
                );

            }
        );
}


/* =========================================================
   VOTE
   ========================================================= */

async function vote(
    id,
    ok
){

    if(!sb) return;


    const createdAt =
        ok
            ? new Date().toISOString()
            : new Date(0).toISOString();


    const {
        error
    } =
        await sb
            .from("dps_markers")
            .update({
                created_at:
                    createdAt
            })
            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Ошибка голосования: " +
            error.message
        );

        return;
    }


    await cleanupExpiredReports();

    await loadFeed();
}


/* =========================================================
   EVENTS
   ========================================================= */

function setupEvents(){

    $("locationSearch")
        .addEventListener(
            "input",
            renderSearchResults
        );


    $("locationSearch")
        .addEventListener(
            "keydown",
            async event => {

                if(
                    event.key !==
                    "Enter"
                )
                    return;


                event.preventDefault();


                const query =
                    normalizeSearch(
                        $("locationSearch")
                            .value
                    );


                if(!query)
                    return;


                const matches =
                    locationsCache.filter(
                        location =>
                            normalizeSearch(
                                location.name
                            ).includes(query)
                    );


                if(
                    matches.length === 1
                ){

                    chooseLocation(
                        matches[0].name
                    );

                }else if(
                    matches.length === 0
                ){

                    await addLocationFromSearch();
                }
            }
        );


    document.addEventListener(
        "click",
        event => {

            const wrapper =
                document.querySelector(
                    ".location-search-wrapper"
                );


            if(
                wrapper &&
                !wrapper.contains(
                    event.target
                )
            ){

                $("searchResults")
                    .style.display =
                    "none";
            }
        }
    );


    $("sendButton")
        .addEventListener(
            "click",
            sendReport
        );


    $("adminButton")
        .addEventListener(
            "click",
            openAdmin
        );


    $("cancelCustom")
        .addEventListener(
            "click",
            () => {

                closePopup(
                    "customLocOverlay"
                );
            }
        );


    $("saveCustom")
        .addEventListener(
            "click",
            saveNewLocation
        );


    $("newLocInput")
        .addEventListener(
            "keydown",
            event => {

                if(
                    event.key ===
                    "Enter"
                ){

                    saveNewLocation();
                }
            }
        );


    $("updateAdBtn")
        .addEventListener(
            "click",
            updateAd
        );


    $("clearAdBtn")
        .addEventListener(
            "click",
            clearAd
        );


    $("adminAddLocation")
        .addEventListener(
            "click",
            async () => {

                try{

                    await addLocation(
                        $("adminNewLocation")
                            .value
                    );


                    $("adminNewLocation")
                        .value =
                        "";


                    await renderAdminLocations();

                }catch(error){

                    alert(
                        error.message
                    );
                }
            }
        );


    $("clearOldReports")
        .addEventListener(
            "click",
            clearOldReports
        );


    $("closeAdmin")
        .addEventListener(
            "click",
            () => {

                adminUnlocked =
                    false;


                closePopup(
                    "adminOverlay"
                );
            }
        );


    document
        .querySelectorAll(
            ".overlay"
        )
        .forEach(
            overlay => {

                overlay.addEventListener(
                    "click",
                    event => {

                        if(
                            event.target ===
                            overlay
                        ){

                            closePopup(
                                overlay.id
                            );
                        }
                    }
                );
            }
        );
}


/* =========================================================

function closePopup(id){

    $(id).style.display =
        "none";
}


/* =========================================================
   INIT
   ========================================================= */

async function init(){

    setupEvents();


    if(
        !initSupabase()
    ){

        return;
    }


    await Promise.all([

        loadLocations(),

        loadSettings(),

        cleanupExpiredReports(),

        loadFeed()

    ]);


    setInterval(
        async () => {

            await cleanupExpiredReports();

            await loadFeed();

            await loadSettings();

        },
        15000
    );
}


init();

</script>
